<rect width="1440" height="780" fill="#f6f8f7" rx="24"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#18364b">體驗模式：一個人走完整個流程</text>
<text x="60" y="106" font-size="18" fill="#607789">用畫面角落的面板切換身分，新朋友和管理員兩邊都能體驗</text>
<rect x="1010" y="34" width="380" height="88" rx="16" fill="#fff" stroke="#dfe7ea" stroke-width="1.5" filter="url(#sh)"/><text x="1028" y="60" font-size="14" fill="#607789">身分切換面板（在畫面角落）</text><rect x="1028" y="74" width="108" height="34" rx="17" fill="#2f6f7e" stroke="#2f6f7e" stroke-width="1.5"/><text x="1082" y="96" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">我是新朋友</text><rect x="1146" y="74" width="108" height="34" rx="17" fill="#fff" stroke="#a67c35" stroke-width="1.5"/><text x="1200" y="96" font-size="15" font-weight="700" fill="#a67c35" text-anchor="middle">我是管理員</text><rect x="1264" y="74" width="108" height="34" rx="17" fill="#fff" stroke="#b6c3cc" stroke-width="1.5"/><text x="1318" y="96" font-size="15" font-weight="700" fill="#607789" text-anchor="middle">重來一次</text><rect x="40" y="150" width="1360" height="230" rx="20" fill="#e8f2f4" stroke="#c7dce1"/><rect x="40" y="400" width="1360" height="230" rx="20" fill="#f8f0e5" stroke="#e6d4b5"/><text x="68" y="262" font-size="24" font-weight="700" fill="#2f6f7e">新朋友</text><text x="68" y="290" font-size="15" fill="#607789">第一次來的人</text><text x="68" y="512" font-size="24" font-weight="700" fill="#a67c35">管理員</text><text x="68" y="540" font-size="15" fill="#607789">也就是你</text><path d="M370 265 H396" stroke="#2f6f7e" stroke-width="3" marker-end="url(#arT)"/><path d="M570 265 H596" stroke="#2f6f7e" stroke-width="3" marker-end="url(#arT)"/><path d="M770 515 H796" stroke="#a67c35" stroke-width="3" marker-end="url(#arG)"/><path d="M970 265 H996" stroke="#2f6f7e" stroke-width="3" marker-end="url(#arT)"/><path d="M1170 265 H1196" stroke="#2f6f7e" stroke-width="3" marker-end="url(#arT)"/><path d="M685 315 V461" stroke="#a67c35" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arG)"/><rect x="623" y="377" width="124" height="28" rx="14" fill="#fff" stroke="#a67c35" stroke-width="1.5"/><text x="685" y="396" font-size="14" font-weight="700" fill="#a67c35" text-anchor="middle">切換成管理員</text><path d="M885 465 V319" stroke="#2f6f7e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arT)"/><rect x="823" y="377" width="124" height="28" rx="14" fill="#fff" stroke="#2f6f7e" stroke-width="1.5"/><text x="885" y="396" font-size="14" font-weight="700" fill="#2f6f7e" text-anchor="middle">切換成新朋友</text><path d="M1285 315 V461" stroke="#a67c35" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arG)"/><rect x="1223" y="377" width="124" height="28" rx="14" fill="#fff" stroke="#a67c35" stroke-width="1.5"/><text x="1285" y="396" font-size="14" font-weight="700" fill="#a67c35" text-anchor="middle">切換成管理員</text><path d="M1285 565 V665 H285 V319" fill="none" stroke="#8a9aa6" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arN)"/><rect x="590" y="651" width="390" height="30" rx="15" fill="#fff" stroke="#b6c3cc"/><text x="785" y="671" font-size="15" fill="#607789" text-anchor="middle">按「重來一次」：清空假資料，從 ① 再體驗</text><rect x="200" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="224" cy="241" r="13" fill="#2f6f7e"/><text x="224" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="244" y="247" font-size="16" font-weight="700" fill="#18364b">打開體驗網址</text><text x="218" y="277" font-size="14" fill="#607789">不用登入</text><text x="218" y="299" font-size="14" fill="#607789">直接開始</text><rect x="400" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="424" cy="241" r="13" fill="#2f6f7e"/><text x="424" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="444" y="247" font-size="16" font-weight="700" fill="#18364b">設定社群暱稱</text><text x="418" y="277" font-size="14" fill="#607789">和正式網站</text><text x="418" y="299" font-size="14" fill="#607789">一樣的視窗</text><rect x="600" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="624" cy="241" r="13" fill="#2f6f7e"/><text x="624" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="644" y="247" font-size="16" font-weight="700" fill="#18364b">看到「審核中」</text><text x="618" y="277" font-size="14" fill="#607789">活動和名單</text><text x="618" y="299" font-size="14" fill="#607789">都還看不到</text><rect x="600" y="465" width="170" height="100" rx="16" fill="#fff" stroke="#d5b77d" stroke-width="2" filter="url(#sh)"/><circle cx="624" cy="491" r="13" fill="#a67c35"/><text x="624" y="496" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="644" y="497" font-size="16" font-weight="700" fill="#18364b">收到審核提示</text><text x="618" y="527" font-size="14" fill="#607789">畫面跳出</text><text x="618" y="549" font-size="14" fill="#607789">「新成員待審核」</text><rect x="800" y="465" width="170" height="100" rx="16" fill="#fff" stroke="#d5b77d" stroke-width="2" filter="url(#sh)"/><circle cx="824" cy="491" r="13" fill="#a67c35"/><text x="824" y="496" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="844" y="497" font-size="16" font-weight="700" fill="#18364b">按「通過」</text><text x="818" y="527" font-size="14" fill="#607789">在後台的</text><text x="818" y="549" font-size="14" fill="#607789">人員清單</text><rect x="800" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="824" cy="241" r="13" fill="#2f6f7e"/><text x="824" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="844" y="247" font-size="16" font-weight="700" fill="#18364b">自動進入網站</text><text x="818" y="277" font-size="14" fill="#607789">活動總覽、日曆</text><text x="818" y="299" font-size="14" fill="#607789">都看得到了</text><rect x="1000" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="1024" cy="241" r="13" fill="#2f6f7e"/><text x="1024" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1044" y="247" font-size="16" font-weight="700" fill="#18364b">+1 接龍</text><text x="1018" y="277" font-size="14" fill="#607789">挑一個活動</text><text x="1018" y="299" font-size="14" fill="#607789">試試看</text><rect x="1200" y="215" width="170" height="100" rx="16" fill="#fff" stroke="#9ec5ce" stroke-width="2" filter="url(#sh)"/><circle cx="1224" cy="241" r="13" fill="#2f6f7e"/><text x="1224" y="246" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="1244" y="247" font-size="16" font-weight="700" fill="#18364b">成團！</text><text x="1218" y="277" font-size="14" fill="#607789">「你是成團的</text><text x="1218" y="299" font-size="14" fill="#607789">關鍵一票」</text><rect x="1200" y="465" width="170" height="100" rx="16" fill="#fff" stroke="#d5b77d" stroke-width="2" filter="url(#sh)"/><circle cx="1224" cy="491" r="13" fill="#a67c35"/><text x="1224" y="496" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="1244" y="497" font-size="16" font-weight="700" fill="#18364b">收到成團提示</text><text x="1218" y="527" font-size="14" fill="#607789">「記得到社群</text><text x="1218" y="549" font-size="14" fill="#607789">公告付款方式」</text><text x="1400" y="740" font-size="14" fill="#607789" text-anchor="end">④⑨ 在正式網站是官方帳號傳來的 LINE 訊息；體驗模式改成在畫面上跳提示</text></svg>