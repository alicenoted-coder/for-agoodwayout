<rect width="1400" height="820" fill="#f6f8f7" rx="24"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#18364b">體驗模式 vs 正式網站</text>
<text x="60" y="106" font-size="18" fill="#607789">同一套畫面，只是「登入、資料、通知」換成假的</text>
<rect x="380" y="140" width="640" height="150" rx="18" fill="#fff" stroke="#9fb9dd" stroke-width="2" filter="url(#sh)"/><text x="700" y="182" font-size="22" font-weight="700" fill="#18364b" text-anchor="middle">同一套畫面</text><rect x="402" y="214" width="138" height="48" rx="12" fill="#edf3fb" stroke="#c7d7eb"/><text x="471" y="244" font-size="15" fill="#18364b" text-anchor="middle">活動總覽・日曆</text><rect x="554" y="214" width="138" height="48" rx="12" fill="#edf3fb" stroke="#c7d7eb"/><text x="623" y="244" font-size="15" fill="#18364b" text-anchor="middle">+1 接龍</text><rect x="706" y="214" width="138" height="48" rx="12" fill="#edf3fb" stroke="#c7d7eb"/><text x="775" y="244" font-size="15" fill="#18364b" text-anchor="middle">審核中畫面</text><rect x="858" y="214" width="138" height="48" rx="12" fill="#edf3fb" stroke="#c7d7eb"/><text x="927" y="244" font-size="15" fill="#18364b" text-anchor="middle">後台・人員清單</text><path d="M620 290 V322 H360 V352" fill="none" stroke="#2f6f7e" stroke-width="3" marker-end="url(#arT)"/><path d="M780 290 V322 H1040 V352" fill="none" stroke="#a67c35" stroke-width="3" marker-end="url(#arG)"/><rect x="80" y="360" width="560" height="340" rx="20" fill="#e8f2f4" stroke="#9ec5ce" stroke-width="2"/><path d="M80 380 Q80 360 100 360 H620 Q640 360 640 380 V420 H80 Z" fill="#2f6f7e"/><text x="108" y="400" font-size="22" font-weight="700" fill="#fff">正式網站</text><text x="220" y="400" font-size="16" fill="#ffffffcc">給社群成員使用</text><rect x="106" y="438" width="70" height="34" rx="17" fill="#fff" stroke="#9ec5ce"/><text x="141" y="461" font-size="16" font-weight="700" fill="#2f6f7e" text-anchor="middle">網址</text><text x="192" y="461" font-size="17" fill="#18364b">liff.line.me/2012620335-…</text><rect x="106" y="492" width="70" height="34" rx="17" fill="#fff" stroke="#9ec5ce"/><text x="141" y="515" font-size="16" font-weight="700" fill="#2f6f7e" text-anchor="middle">登入</text><text x="192" y="515" font-size="17" fill="#18364b">用自己的 LINE 帳號登入</text><rect x="106" y="546" width="70" height="34" rx="17" fill="#fff" stroke="#9ec5ce"/><text x="141" y="569" font-size="16" font-weight="700" fill="#2f6f7e" text-anchor="middle">資料</text><text x="192" y="569" font-size="17" fill="#18364b">Supabase 資料庫（大家共用的真資料）</text><rect x="106" y="600" width="70" height="34" rx="17" fill="#fff" stroke="#9ec5ce"/><text x="141" y="623" font-size="16" font-weight="700" fill="#2f6f7e" text-anchor="middle">通知</text><text x="192" y="623" font-size="17" fill="#18364b">官方帳號真的傳 LINE 訊息</text><rect x="106" y="654" width="70" height="34" rx="17" fill="#fff" stroke="#9ec5ce"/><text x="141" y="677" font-size="16" font-weight="700" fill="#2f6f7e" text-anchor="middle">用途</text><text x="192" y="677" font-size="17" fill="#18364b">正式報名接龍</text><rect x="760" y="360" width="560" height="340" rx="20" fill="#f8f0e5" stroke="#d5b77d" stroke-width="2"/><path d="M760 380 Q760 360 780 360 H1300 Q1320 360 1320 380 V420 H760 Z" fill="#a67c35"/><text x="788" y="400" font-size="22" font-weight="700" fill="#fff">體驗模式</text><text x="900" y="400" font-size="16" fill="#ffffffcc">給你體驗流程、對外展示</text><rect x="786" y="438" width="70" height="34" rx="17" fill="#fff" stroke="#d5b77d"/><text x="821" y="461" font-size="16" font-weight="700" fill="#a67c35" text-anchor="middle">網址</text><text x="872" y="461" font-size="17" fill="#18364b">另一個體驗用網址</text><rect x="786" y="492" width="70" height="34" rx="17" fill="#fff" stroke="#d5b77d"/><text x="821" y="515" font-size="16" font-weight="700" fill="#a67c35" text-anchor="middle">登入</text><text x="872" y="515" font-size="17" fill="#18364b">不用 LINE，打開就開始</text><rect x="786" y="546" width="70" height="34" rx="17" fill="#fff" stroke="#d5b77d"/><text x="821" y="569" font-size="16" font-weight="700" fill="#a67c35" text-anchor="middle">資料</text><text x="872" y="569" font-size="17" fill="#18364b">假資料，只存在你自己的瀏覽器</text><rect x="786" y="600" width="70" height="34" rx="17" fill="#fff" stroke="#d5b77d"/><text x="821" y="623" font-size="16" font-weight="700" fill="#a67c35" text-anchor="middle">通知</text><text x="872" y="623" font-size="17" fill="#18364b">畫面上跳提示，顯示訊息內容</text><rect x="786" y="654" width="70" height="34" rx="17" fill="#fff" stroke="#d5b77d"/><text x="821" y="677" font-size="16" font-weight="700" fill="#a67c35" text-anchor="middle">特色</text><text x="872" y="677" font-size="17" fill="#18364b">角落有「身分切換面板」，可一鍵重來</text><rect x="80" y="730" width="1240" height="56" rx="16" fill="#fff7e6" stroke="#e3c98d" stroke-width="1.5"/><text x="700" y="765" font-size="18" fill="#6e4c12" text-anchor="middle">體驗模式碰不到正式資料庫：不會產生假資料、不會誤發通知、不會改到你的管理員權限</text></svg>